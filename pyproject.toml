[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "primekgagent"
version = "0.2.0"
description = "Download the PrimeKG precision medicine knowledge graph once from Harvard Dataverse and query it on this computer: node lookup, neighbours and short paths between drugs, diseases, genes and phenotypes. No key needed."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Baranzini Lab", email = "wanjun.gu@ucsf.edu"}]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.0,<5",
    "httpx>=0.28.1,<1",
    "pydantic>=2.11.7,<3",
]

[project.scripts]
primekgagent = "primekgagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/primekgagent"]

[tool.uv]
# cryptography (pulled in by fastmcp) has no Intel Mac wheels from 49 on.
constraint-dependencies = [
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
